<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ZAHRA Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Login Form -->
            <div id="loginForm" class="auth-section">
                <div class="auth-header">
                    <div class="auth-logo">ZAHRA</div>
                    <div class="auth-subtitle">Admin Portal</div>
                </div>

                <div id="loginAlert"></div>

                <form id="emailLoginForm">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Email Address</label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            class="form-input" 
                            placeholder="vendor@zahra.studio"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <span id="loginBtnText">Sign In</span>
                        <i class="fas fa-spinner fa-spin" id="loginSpinner" style="display: none;"></i>
                    </button>
                </form>

                <div class="form-link">
                    <a href="#" onclick="showForgotPassword(); return false;">Forgot password?</a>
                </div>

                <div class="form-link">
                    <span style="font-size: 12px; color: var(--text-light);">
                        Admin access only. Contact support for credentials.
                    </span>
                </div>
            </div>

            <!-- Forgot Password Form -->
            <div id="forgotPasswordForm" class="auth-section" style="display: none;">
                <div class="auth-header">
                    <div class="auth-logo" style="font-size: 24px;">ZAHRA</div>
                    <div class="auth-subtitle">Reset Password</div>
                </div>

                <div id="forgotAlert"></div>

                <p style="font-size: 13px; color: var(--text-light); margin-bottom: 24px;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>

                <form id="resetEmailForm">
                    <div class="form-group">
                        <label class="form-label" for="resetEmail">Email Address</label>
                        <input 
                            type="email" 
                            id="resetEmail" 
                            class="form-input" 
                            placeholder="vendor@zahra.studio"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" id="resetBtn">
                        <span id="resetBtnText">Send Reset Link</span>
                        <i class="fas fa-spinner fa-spin" id="resetSpinner" style="display: none;"></i>
                    </button>
                </form>

                <div class="form-link">
                    <a href="#" onclick="showLogin(); return false;">← Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="admin.js"></script>
    <script>
        // ===== LOGIN PAGE INITIALIZATION =====
        // This is the entry point for admin authentication
        
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is already logged in
            checkAdminSession();

            // Attach form listeners
            document.getElementById('emailLoginForm').addEventListener('submit', handleEmailLogin);
            document.getElementById('resetEmailForm').addEventListener('submit', handlePasswordReset);
        });

        function isMockAdmin() {
            return localStorage.getItem('mockAdmin') === 'true';
        }

        function setMockAdminSession(email) {
            localStorage.setItem('mockAdmin', 'true');
            localStorage.setItem('adminSession', 'active');
            if (email) {
                localStorage.setItem('adminEmail', email);
            }
        }

        // ===== SESSION CHECK =====
        // INTEGRATION POINT: Supabase auth session check
        async function checkAdminSession() {
            try {
                if (isMockAdmin()) {
                    console.log('Mock admin session detected');
                    window.location.href = 'dashboard.html';
                    return;
                }

                // TODO: Call Supabase to check if user has active session
                // const { data: { user } } = await supabase.auth.getUser();
                // if (user) {
                //     window.location.href = 'dashboard.html';
                // }

                if (localStorage.getItem('adminSession')) {
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error('Session check error:', error);
            }
        }

        // ===== EMAIL LOGIN =====
        // INTEGRATION POINT: Supabase email/password authentication
        async function handleEmailLogin(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loginSpinner = document.getElementById('loginSpinner');
            const loginAlert = document.getElementById('loginAlert');

            // Show loading state
            loginBtn.disabled = true;
            loginBtnText.textContent = 'Signing in...';
            loginSpinner.style.display = 'inline-block';
            loginAlert.innerHTML = '';

            try {
                // SUPABASE INTEGRATION: Replace with actual Supabase auth call
                // const { data, error } = await SupabaseService.loginVendor(email, password);
                
                // TEMPORARY FALLBACK: Simulate login for development without credential validation
                setMockAdminSession(email || 'admin@zahra.studio');
                console.log('Mock admin session detected');

                showAlert(loginAlert, 'success', 'Development mode active. Redirecting to dashboard...');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 300);
            } catch (error) {
                showAlert(loginAlert, 'error', error.message);
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Sign In';
                loginSpinner.style.display = 'none';
            }
        }

        // ===== PASSWORD RESET REQUEST =====
        // INTEGRATION POINT: Supabase password reset email
        async function handlePasswordReset(e) {
            e.preventDefault();

            const email = document.getElementById('resetEmail').value;
            const resetBtn = document.getElementById('resetBtn');
            const resetBtnText = document.getElementById('resetBtnText');
            const resetSpinner = document.getElementById('resetSpinner');
            const forgotAlert = document.getElementById('forgotAlert');

            // Show loading state
            resetBtn.disabled = true;
            resetBtnText.textContent = 'Sending...';
            resetSpinner.style.display = 'inline-block';
            forgotAlert.innerHTML = '';

            try {
                // SUPABASE INTEGRATION: Call password reset email service
                // const { data, error } = await SupabaseService.resetPassword(email);
                
                // TEMPORARY FALLBACK: Simulate success
                showAlert(forgotAlert, 'success', 'If this email is registered, you will receive a password reset link shortly.');
                
                setTimeout(() => {
                    showLogin();
                }, 2000);
            } catch (error) {
                showAlert(forgotAlert, 'error', error.message);
            } finally {
                // Reset button state
                resetBtn.disabled = false;
                resetBtnText.textContent = 'Send Reset Link';
                resetSpinner.style.display = 'none';
            }
        }

        // ===== UI HELPERS =====
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('forgotPasswordForm').style.display = 'none';
            document.getElementById('loginEmail').focus();
        }

        function showForgotPassword() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('forgotPasswordForm').style.display = 'block';
            document.getElementById('resetEmail').focus();
        }

        // Alert display helper
        function showAlert(container, type, message) {
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            container.innerHTML = `
                <div class="alert alert-${type}">
                    <i class="fas ${icons[type]}"></i>
                    <span>${message}</span>
                </div>
            `;
        }
    </script>
</body>
</html>
